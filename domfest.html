<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Domingos y Festivos - Zaragoza</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #2980b9;
            --success-color: #27ae60;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
        }

        h2, h3, h4 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-weight: 600;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        h3 { font-weight: 400; }
        h4 { font-weight: 300; }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, button {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(41, 128, 185, 0.1);
        }

        .btn-add {
            background-color: var(--success-color);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-add:hover { background-color: #219653; }

        .table-container {
            margin-top: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            background-color: #fff;
        }

        th, td {
            border: 1px solid #dbdbdb;
            padding: 8px;
            text-align: center;
            font-size: 0.95rem;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        tr:nth-child(even) { background-color: #f9f9f9; }

        /* Celdas editables en pantalla clara y accesibles */
        .input-celda {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 0.95rem;
            text-align: center;
            color: #2c3e50;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        .input-celda:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.075), 0 0 4px rgba(41, 128, 185, 0.4);
        }

        .col-total {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.1rem;
            background-color: #fbfcfc;
        }

        .empty-row {
            color: #999;
            font-style: italic;
            padding: 20px;
        }

        .actions-container {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .btn-action {
            border: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-pdf { background-color: #e74c3c; color: white; }
        .btn-pdf:hover { background-color: #c0392b; }
        .btn-clear { background-color: #95a5a6; color: white; }
        .btn-clear:hover { background-color: #7f8c8d; }

        /* ESTILOS EXCLUSIVOS PARA EL CLON DEL PDF (No afectan a tu pantalla) */
        body.modo-pdf-activo .clon-oculto-pdf {
            display: block !important;
            background: #fff !important;
        }

        .modo-pdf {
            box-shadow: none !important;
            padding: 10px !important;
            margin: 0 !important;
            background: #fff !important;
            width: 100% !important;
        }
        
        .modo-pdf .table-container {
            overflow: visible !important;
        }

        .modo-pdf table {
            width: 100% !important;
            table-layout: fixed !important; /* Cuadra las columnas exactamente al A4 */
            page-break-inside: avoid;
        }

        /* Reparto exacto de columnas en el PDF para que no se desplace */
        .modo-pdf th:nth-child(1), .modo-pdf td:nth-child(1) { width: 15%; }
        .modo-pdf th:nth-child(2), .modo-pdf td:nth-child(2) { width: 11%; }
        .modo-pdf th:nth-child(3), .modo-pdf td:nth-child(3) { width: 36%; }
        .modo-pdf th:nth-child(4), .modo-pdf td:nth-child(4) { width: 18%; }
        .modo-pdf th:nth-child(5), .modo-pdf td:nth-child(5) { width: 10%; }
        .modo-pdf th:nth-child(6), .modo-pdf td:nth-child(6) { width: 10%; }

        .span-temporal-pdf {
            display: block;
            word-wrap: break-word;
            white-space: normal;
            font-size: 0.95rem;
            text-align: center;
            color: #2c3e50;
            padding: 4px;
        }
    </style>
</head>
<body>

<div class="container" id="contenedor-registro">
    <h2>Registro de Domingos y Festivos</h2>
    <h3>Filcea Bogdana Anca - Porcentaje de jornada: 72%</h3>
    <h4>Según Convenio: En porcentaje de jornada 100%; Domingo: 12,61 € Festivo: 25 €</h4>
    
    <div class="grid-inputs no-print">
        <div class="form-group">
            <label for="mes">Mes</label>
            <select id="mes">
                <option value="0">Enero</option>
                <option value="1">Febrero</option>
                <option value="2">Marzo</option>
                <option value="3">Abril</option>
                <option value="4">Mayo</option>
                <option value="5">Junio</option>
                <option value="6">Julio</option>
                <option value="7">Agosto</option>
                <option value="8">Septiembre</option>
                <option value="9">Octubre</option>
                <option value="10">Noviembre</option>
                <option value="11">Diciembre</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="anio">Año</label>
            <select id="anio">
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
            </select>
        </div>

        <button class="btn-add" onclick="agregarRegistro()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Registrar en Tabla
        </button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Mes</th>
                    <th>Año</th>
                    <th>Domingos</th>
                    <th>Festivos</th>
                    <th>Total Dom</th>
                    <th>Total Fest</th>
                </tr>
            </thead>
            <tbody id="tabla-cuerpo">
                <tr id="row-empty">
                    <td colspan="6" class="empty-row">No hay registros. Selecciona un mes y haz clic en "Registrar en Tabla".</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="actions-container no-print">
        <button class="btn-action btn-clear" onclick="limpiarTabla()">Limpiar Tabla</button>
        <button class="btn-action btn-pdf" onclick="descargarPDF()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Descargar archivo PDF
        </button>
    </div>
</div>

<script>
const calendarioFestivos = {
    2025: { 0: [1, 6, 29], 2: [5], 3: [17, 18, 23], 4: [1], 6: [29], 7: [15], 9: [13], 10: [1], 11: [6, 8, 25] },
    2026: { 0: [1, 6, 29], 2: [5], 3: [2, 3, 23], 4: [1], 6: [29], 7: [15], 9: [12], 10: [2], 11: [7, 8, 25] }
};

let tablaRegistros = [];

function agregarRegistro() {
    const selectMes = document.getElementById('mes');
    const mesId = parseInt(selectMes.value);
    const mesNombre = selectMes.options[selectMes.selectedIndex].text;
    const anio = parseInt(document.getElementById('anio').value);

    tablaRegistros = tablaRegistros.filter(reg => !(reg.mesId === mesId && reg.anio === anio));

    let listaDomingos = [];
    let listaFestivos = [];
    const ultimoDia = new Date(anio, mesId + 1, 0).getDate();

    for (let dia = 1; dia <= ultimoDia; dia++) {
        const fecha = new Date(anio, mesId, dia);
        const diaFormateado = String(dia).padStart(2, '0');
        if (fecha.getDay() === 0) listaDomingos.push(diaFormateado);
        if (calendarioFestivos[anio] && calendarioFestivos[anio][mesId]) {
            if (calendarioFestivos[anio][mesId].includes(dia)) listaFestivos.push(diaFormateado);
        }
    }

    tablaRegistros.push({
        mesId: mesId,
        mesNombre: mesNombre,
        anio: anio,
        domingos: listaDomingos.join(' '),
        festivos: listaFestivos.join(' '),
        totalDom: listaDomingos.length,
        totalFest: listaFestivos.length
    });

    tablaRegistros.sort((a, b) => a.anio !== b.anio ? a.anio - b.anio : a.mesId - b.mesId);
    actualizarTablaHTML();
}

function actualizarTablaHTML() {
    const tbody = document.getElementById('tabla-cuerpo');
    tbody.innerHTML = '';

    if (tablaRegistros.length === 0) {
        tbody.innerHTML = `<tr id="row-empty"><td colspan="6" class="empty-row">No hay registros. Selecciona un mes y haz clic en "Registrar en Tabla".</td></tr>`;
        return;
    }

    tablaRegistros.forEach((reg, index) => {
        const fila = document.createElement('tr');
        fila.innerHTML = `
            <td><strong>${reg.mesNombre}</strong></td>
            <td>${reg.anio}</td>
            <td><input type="text" class="input-celda" value="${reg.domingos}" oninput="editarDiasDinamicos(${index}, 'domingos', this.value)"></td>
            <td><input type="text" class="input-celda" value="${reg.festivos}" oninput="editarDiasDinamicos(${index}, 'festivos', this.value)"></td>
            <td class="col-total" id="total-dom-${index}">${reg.totalDom}</td>
            <td class="col-total" id="total-fest-${index}">${reg.totalFest}</td>
        `;
        tbody.appendChild(fila);
    });
}

function editarDiasDinamicos(index, tipo, nuevoValor) {
    tablaRegistros[index][tipo] = nuevoValor;
    const diasValidos = nuevoValor.trim().split(/\s+/).filter(dia => dia !== "");
    const nuevoTotal = nuevoValor.trim() === "" ? 0 : diasValidos.length;

    if (tipo === 'domingos') {
        tablaRegistros[index].totalDom = nuevoTotal;
        document.getElementById(`total-dom-${index}`).innerText = nuevoTotal;
    } else {
        tablaRegistros[index].totalFest = nuevoTotal;
        document.getElementById(`total-fest-${index}`).innerText = nuevoTotal;
    }
}

function limpiarTabla() { tablaRegistros = []; actualizarTablaHTML(); }

// NUEVO MÉTODO SEGURO: Genera el PDF usando un clon en memoria. Tu pantalla queda intacta.
function descargarPDF() {
    const elementoOriginal = document.getElementById('contenedor-registro');
    
    // 1. Creamos un clon exacto del contenedor para procesar el PDF sin tocar tu pantalla
    const clon = elementoOriginal.cloneNode(true);
    clon.classList.add('clon-oculto-pdf');
    
    // 2. Rescatamos los valores que hayas escrito a mano en los inputs originales y los pasamos al clon como texto plano
    const inputsOriginales = elementoOriginal.querySelectorAll('.input-celda');
    const inputsClon = clon.querySelectorAll('.input-celda');
    
    inputsOriginales.forEach((inputOriginal, index) => {
        const inputDelClon = inputsClon[index];
        const span = document.createElement('span');
        span.className = 'span-temporal-pdf';
        span.innerText = inputOriginal.value || ' ';
        
        // Reemplazamos el cuadro de entrada por texto en el clon
        inputDelClon.parentNode.replaceChild(span, inputDelClon);
    });

    // 3. Estilizamos el clon para el renderizado perfecto
    clon.classList.add('modo-pdf');
    clon.style.position = 'absolute';
    clon.style.left = '-9999px'; // Lo mandamos fuera de la pantalla visible
    clon.style.top = '0';
    clon.style.width = '1024px'; // Simulamos ancho de PC de escritorio para que quepa todo perfecto
    
    document.body.appendChild(clon);
    document.body.classList.add('modo-pdf-activo');

    const opciones = {
        margin:       10,
        filename:     'Registro_Domingos_Festivos_Filcea Bogdana Anca.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { 
            scale: 2, 
            useCORS: true,
            scrollX: 0,
            scrollY: 0
        },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: ['avoid-all', 'css'] }
    };

    // 4. Se genera el PDF basándonos ÚNICAMENTE en el clon oculto
    html2pdf().set(opciones).from(clon).save().then(() => {
        // Limpieza absoluta al terminar
        document.body.classList.remove('modo-pdf-activo');
        clon.remove();
    }).catch((err) => {
        document.body.classList.remove('modo-pdf-activo');
        clon.remove();
        console.error("Error al generar PDF:", err);
    });
}
</script>

</body>
</html>
