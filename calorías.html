<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Calculadora de Calorías Completa</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --danger: #e74c3c; --accent: #3498db; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .row { display: grid; grid-template-columns: 2fr 1fr 50px; gap: 15px; margin-bottom: 15px; align-items: center; padding: 10px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; }
        
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; width: 100%; box-sizing: border-box; }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 5px rgba(52,152,219,0.3); }

        .btn { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.3s ease; text-transform: uppercase; }
        .btn-add { background-color: var(--secondary); color: white; width: 100%; margin-top: 10px; }
        .btn-add:hover { background-color: #219150; }
        .btn-calc { background-color: var(--accent); color: white; width: 100%; margin-top: 15px; font-size: 1.1em; }
        .btn-calc:hover { background-color: #2980b9; }
        .btn-remove { background-color: var(--danger); color: white; height: 40px; width: 40px; display: flex; align-items: center; justify-content: center; }
        .btn-remove:hover { background-color: #c0392b; }

        #resultado { margin-top: 30px; padding: 20px; background: var(--primary); color: white; border-radius: 10px; font-weight: bold; text-align: center; font-size: 1.5em; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .instrucciones { font-size: 0.9em; color: #666; margin-bottom: 20px; text-align: center; }
        
        /* Estilo para el buscador */
        .search-box { margin-bottom: 5px; font-size: 0.85em; border-color: #eee; background: #fff; }
    </style>
</head>
