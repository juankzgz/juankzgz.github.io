<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Horario - Versión Pro</title>

<style>
:root {
    --primary:#2563eb;
    --secondary:#64748b;
    --warning:#f59e0b;
    --danger:#ef4444;
    --bg:#f8fafc;
}

body{
    font-family:'Segoe UI',system-ui,sans-serif;
    background:var(--bg);
    padding:20px;
    color:#1e293b;
}

.container{
    max-width:950px;
    margin:auto;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 6px rgba(0,0,0,.1);
}

h1{text-align:center;color:var(--primary);}

.form-group{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:15px;
    background:#f1f5f9;
    padding:15px;
    border-radius:8px;
}

label{font-size:.85rem;font-weight:700;}
input,select{
    width:100%;
    padding:8px;
    border:1px solid #cbd5e1;
    border-radius:4px;
}

.main-actions{
    display:flex;
    gap:10px;
    margin:20px 0;
    flex-wrap:wrap;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
}

.btn-add{background:var(--primary);color:#fff;}
.btn-dnt{background:var(--warning);color:#fff;}

.dropdown{margin-left:auto;position:relative;}
.btn-menu{background:var(--secondary);color:#fff;}

.dropdown-content{
    display:none;
    position:absolute;
    right:0;
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:8px;
    min-width:220px;
    box-shadow:0 8px 16px rgba(0,0,0,.1);
}

.dropdown:hover .dropdown-content{display:block;}

.dropdown-content button,
.dropdown-content label{
    width:100%;
    padding:12px 16px;
    text-align:left;
    background:none;
    border:none;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #e2e8f0;
    padding:12px;
    text-align:center;
}

th{background:#f1f5f9;}

.row-dnt{
    background:#fff7ed;
    font-style:italic;
}

.jornada-partida-fields{display:none;}

.delete-btn-cell button{
    background:none;
    border:1px solid #fee2e2;
    color:var(--danger);
    padding:5px 8px;
    border-radius:4px;
}

.resumen{
    margin-top:20px;
    padding:15px;
    background:#f1f5f9;
    border-radius:8px;
    font-weight:700;
    text-align:right;
}

@media print{
    .form-group,.main-actions,.delete-btn-cell,.dropdown{display:none;}
    body{background:#fff;padding:0;}
    .container{box-shadow:none;padding:0;}
}
    .row-domingo {
    background-color: #fee2e2; /* rojo suave */
    color: #991b1b;
    font-weight: 600;
}

.row-festivo {
    background-color: #fef9c3; /* amarillo suave */
    color: #854d0e;
    font-weight: 600;
}

.row-domingo-festivo {
    background-color: #fde68a; /* naranja */
    color: #78350f;
    font-weight: 700;
}
.leyenda {
    margin-top: 12px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 0.85rem;
}

.leyenda-item {
    padding: 4px 8px;
    border-radius: 4px;
    font-weight: 600;
}

/* Colores solo para la leyenda */
.leyenda-item.dnt {
    background-color: #fff7ed;
    color: #374151;
}

.leyenda-item.domingo {
    background-color: #fecaca;
    color: #7f1d1d;
}

.leyenda-item.festivo {
    background-color: #fef3c7;
    color: #78350f;
}

.leyenda-item.domingo-festivo {
    background-color: #fed7aa;
    color: #7c2d12;
}
    
</style>
</head>

<body>
<div class="container">
<h1>Registro de Jornada Laboral</h1>

<div class="form-group">
    <div><label>Fecha</label><input type="date" id="fecha"></div>
    <div>
        <label>Tipo Jornada</label>
        <select id="tipoJornada" onchange="toggleJornada()">
            <option value="continua">Continua</option>
            <option value="partida">Partida</option>
        </select>
    </div>
    <div><label>Entrada 1</label><input type="time" id="ent1"></div>
    <div><label>Salida 1</label><input type="time" id="sal1"></div>
    <div class="jornada-partida-fields"><label>Entrada 2</label><input type="time" id="ent2"></div>
    <div class="jornada-partida-fields"><label>Salida 2</label><input type="time" id="sal2"></div>
</div>

<div class="main-actions">
    <button class="btn-dnt" onclick="agregarDNT()"> ☕ DNT </button>
    <button class="btn-add" onclick="agregarFila()">✅ Añadir registro</button>
    
    <div class="dropdown">
        <button class="btn-menu">Opciones ▾</button>
        <div class="dropdown-content">
            <button onclick="exportarCSV()">📥 Descargar CSV</button>
            <label>📤 Cargar CSV
                <input type="file" hidden onchange="importarCSV(this)">
            </label>
            <button onclick="window.print()">📄 Guardar PDF</button>
            <button onclick="limpiarTodo()" style="color:var(--danger)">⚠️ Borrar todo</button>
        </div>
    </div>
</div>

<table>
<thead>
<tr>
<th>Fecha</th><th>Tipo</th><th>T1</th><th>T2</th><th>Horas</th><th class="delete-btn-cell">Acción</th>
</tr>
</thead>
<tbody id="cuerpoTabla"></tbody>
</table>

<div class="resumen" id="resumenMensual">Total mensual: 00:00</div>
</div>
<div class="leyenda">
    <span class="leyenda-item dnt">DNT</span>
    <span class="leyenda-item domingo">Domingo</span>
    <span class="leyenda-item festivo">Festivo</span>
    <span class="leyenda-item domingo-festivo">Domingo festivo</span>
</div>
<script>
let registros = JSON.parse(localStorage.getItem('controlHorarioV4')) || [];
document.getElementById('fecha').valueAsDate = new Date();

function toggleJornada(){
    document.querySelectorAll('.jornada-partida-fields')
    .forEach(e=>e.style.display=tipoJornada.value==='partida'?'block':'none');
}

function calcularMinutos(inicio,fin){
    if(!inicio||!fin) return 0;
    let [h1,m1]=inicio.split(':').map(Number);
    let [h2,m2]=fin.split(':').map(Number);
    let min=(h2*60+m2)-(h1*60+m1);
    if(min<0) min+=1440;
    return min;
}

function minutosAHora(min){
    return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');
}

function agregarFila() {
    const fechaEl = document.getElementById('fecha');
    const ent1El = document.getElementById('ent1');
    const sal1El = document.getElementById('sal1');
    const ent2El = document.getElementById('ent2');
    const sal2El = document.getElementById('sal2');
    const tipoEl = document.getElementById('tipoJornada');

    if (!fechaEl.value || !ent1El.value || !sal1El.value) {
        alert("Faltan datos del primer turno");
        return;
    }

    let totalMin = calcularMinutos(ent1El.value, sal1El.value);
    let t2 = '-';

    if (tipoEl.value === 'partida') {
        if (!ent2El.value || !sal2El.value) {
            alert("Faltan datos del segundo turno");
            return;
        }
        totalMin += calcularMinutos(ent2El.value, sal2El.value);
        t2 = `${ent2El.value} - ${sal2El.value}`;
    }

    registros.push({
        id: Date.now(),
        fecha: fechaEl.value,
        tipo: tipoEl.value.toUpperCase(),
        t1: `${ent1El.value} - ${sal1El.value}`,
        t2: t2,
        minutos: totalMin
    });

    ent1El.value = sal1El.value = ent2El.value = sal2El.value = '';
    guardar();
}

function agregarDNT() {
    const fechaEl = document.getElementById('fecha');

    if (!fechaEl.value) {
        alert("Selecciona una fecha");
        return;
    }

    registros.push({
        id: Date.now(),
        fecha: fechaEl.value,
        tipo: 'DNT',
        t1: '-',
        t2: '-',
        minutos: 0
    });

    guardar();
}

function limpiarInputs(){ent1.value=sal1.value=ent2.value=sal2.value='';}

function guardar(){
    localStorage.setItem('controlHorarioV4',JSON.stringify(registros));
    renderizar();
}

function esFestivo(fechaISO) {
    const festivos = [
        '2026-01-01', // Año Nuevo
        '2026-01-06', // Reyes
        '2026-01-29', // San Valero 
        '2026-03-05', // Cincomarzada
        '2026-04-02', // Jueves Santo 
        '2026-04-03', // Viernes Santo
        '2026-04-23', // San Jorge 
        '2026-05-01', // Día del Trabajador
        '2026-07-29', // Santa Marta 
        '2026-08-15', // Asunción
        '2026-10-12', // Fiesta Nacional
        '2026-11-02', // Todos los santos 
        '2026-12-07', // Día de la Constitución 
        '2026-12-08', // Inmaculada Concepción 
        '2026-12-25'  // Navidad
    ];
    return festivos.includes(fechaISO);
}
    
function formatearFecha(fechaISO) {
    const [y, m, d] = fechaISO.split('-');
    return `${d}/${m}/${y.slice(2)}`;
}
function renderizar(){
    cuerpoTabla.innerHTML='';
    let totalMes = 0;
    let mesActual = new Date(fecha.value).toISOString().slice(0,7);

    [...registros]
    .sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))
    .forEach(r => {

        // 1️⃣ Crear fila
        const tr = cuerpoTabla.insertRow();

        // 2️⃣ Marcar DNT si procede
        if (r.tipo === 'DNT') {
            tr.classList.add('row-dnt');
        }

        // 3️⃣ Rellenar celdas
        tr.innerHTML = `
            <td>${formatearFecha(r.fecha)}</td>
            <td>${r.tipo}</td>
            <td>${r.t1}</td>
            <td>${r.t2}</td>
            <td><strong>${minutosAHora(r.minutos)}</strong></td>
            <td class="delete-btn-cell">
                <button onclick="eliminar(${r.id})">❌</button>
            </td>
        `;

        // 🔴🟡 DETECTAR DOMINGO Y FESTIVO (SIN SOBREESCRIBIR DNT)
if (r.tipo !== 'DNT') {
    const fechaObj = new Date(r.fecha + 'T00:00:00');
    const esDomingo = fechaObj.getDay() === 0;
    const festivo = esFestivo(r.fecha);

    if (esDomingo && festivo) {
        tr.classList.add('row-domingo-festivo');
    } else if (esDomingo) {
        tr.classList.add('row-domingo');
    } else if (festivo) {
        tr.classList.add('row-festivo');
    }
}

        // 5️⃣ Sumar total mensual
        if (r.fecha.startsWith(mesActual)) {
            totalMes += r.minutos;
        }
    });

    const fechaMes = new Date(mesActual + '-01');
const nombreMes = fechaMes.toLocaleDateString('es-ES', {
    month: 'long',
    year: 'numeric'
});

resumenMensual.textContent =
    `Total ${nombreMes}: ${minutosAHora(totalMes)}`;
}

function eliminar(id){
    if(confirm('¿Eliminar registro?')){
        registros=registros.filter(r=>r.id!==id);
        guardar();
    }
}

function limpiarTodo(){
    if(confirm('Se borrarán todos los registros')){
        registros=[];
        guardar();
    }
}

function exportarCSV(){
    let csv="Fecha,Tipo,Turno1,Turno2,Total\n";
    registros.forEach(r=>csv+=`${r.fecha},${r.tipo},${r.t1},${r.t2},${minutosAHora(r.minutos)}\n`);
    let a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='control_horario.csv';
    a.click();
}

function importarCSV(i){
    const r=new FileReader();
    r.onload=e=>{
        e.target.result.split(/\r?\n/).forEach(l=>{
            let c=l.split(',');
            if(c.length>=5 && c[0]!=='Fecha'){
                let [h,m]=c[4].split(':').map(Number);
                registros.push({
                    id:Date.now()+Math.random(),
                    fecha:c[0],
                    tipo:c[1],
                    t1:c[2],
                    t2:c[3],
                    minutos:(h*60+m)||0
                });
            }
        });
        guardar();
    };
    r.readAsText(i.files[0]);
}

renderizar();
</script>
</body>
</html>
