<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Horario - Versión Compatible</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 20px; color: #1e293b; }
        .container { max-width: 950px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }
        
        .form-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px; padding: 15px; background: #f1f5f9; border-radius: 8px; }
        
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }

        .main-actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        
        button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; gap: 5px; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-add { background-color: var(--primary); color: white; }
        .btn-dnt { background-color: var(--warning); color: white; }

        .dropdown { position: relative; display: inline-block; margin-left: auto; }
        .btn-menu { background-color: var(--secondary); color: white; }
        .dropdown-content { 
            display: none; position: absolute; right: 0; background-color: white; 
            min-width: 200px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            z-index: 10; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0;
        }
        .dropdown-content button, .dropdown-content label { 
            width: 100%; padding: 12px 16px; text-align: left; background: none; 
            color: #334155; border-radius: 0; border:none; border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem; cursor: pointer; display: block; box-sizing: border-box;
        }
        .dropdown-content button:hover, .dropdown-content label:hover { background-color: #f8fafc; color: var(--primary); }
        .dropdown:hover .dropdown-content { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: center; font-size: 0.9rem; }
        th { background-color: #f1f5f9; }

        .row-dnt { background-color: #fff7ed; color: #9a3412; font-style: italic; }
        .jornada-partida { display: none; }

        @media print {
            .form-group, .main-actions, .delete-btn, .dropdown { display: none !important; }
            .container { box-shadow: none; border: none; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Control de Jornada Laboral</h1>

    <div class="form-group">
        <div><label>Fecha</label><input type="date" id="fecha"></div>
        <div>
            <label>Tipo de Jornada</label>
            <select id="tipoJornada" onchange="toggleJornada()">
                <option value="continua">Continua</option>
                <option value="partida">Partida</option>
            </select>
        </div>
        <div><label>Entrada 1</label><input type="time" id="ent1"></div>
        <div><label>Salida 1</label><input type="time" id="sal1"></div>
        <div class="jornada-partida"><label>Entrada 2</label><input type="time" id="ent2"></div>
        <div class="jornada-partida"><label>Salida 2</label><input type="time" id="sal2"></div>
    </div>

    <div class="main-actions">
        <button class="btn-add" onclick="agregarFila()">Añadir Registro</button>
        <button class="btn-dnt" onclick="agregarDNT()">DNT (No Trabajado)</button>

        <div class="dropdown">
            <button class="btn-menu">Opciones y Archivos ▾</button>
            <div class="dropdown-content">
                <button onclick="exportarCSV()">📥 Descargar CSV</button>
                <label style="margin:0;">📤 Cargar CSV/Archivo
                    <input type="file" id="importCsv" accept=".csv, .txt, text/csv, text/plain" style="display:none" onchange="importarCSV(this)">
                </label>
                <button onclick="window.print()">📄 Guardar PDF</button>
                <button onclick="limpiarTodo()" style="color:var(--danger)">⚠️ Borrar Todo</button>
            </div>
        </div>
    </div>

    <table id="tablaRegistros">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Turno 1</th>
                <th>Turno 2</th>
                <th>Total</th>
                <th class="delete-btn">Acción</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
    </table>
</div>

<script>
    let registros = JSON.parse(localStorage.getItem('controlHorarioV3')) || [];
    document.getElementById('fecha').valueAsDate = new Date();
    renderizarTabla();

    function toggleJornada() {
        const tipo = document.getElementById('tipoJornada').value;
        document.querySelectorAll('.jornada-partida').forEach(el => 
            el.style.display = tipo === 'partida' ? 'block' : 'none'
        );
    }

    function calcularHoras(inicio, fin) {
        if (!inicio || !fin) return 0;
        const [h1, m1] = inicio.split(':').map(Number);
        const [h2, m2] = fin.split(':').map(Number);
        return ((h2 * 60 + m2) - (h1 * 60 + m1)) / 60;
    }

    function agregarFila() {
        const fecha = document.getElementById('fecha').value;
        const tipo = document.getElementById('tipoJornada').value;
        const ent1 = document.getElementById('ent1').value;
        const sal1 = document.getElementById('sal1').value;
        if (!fecha || !ent1 || !sal1) return alert("Faltan datos");

        let total = calcularHoras(ent1, sal1);
        let t2 = "-";
        if (tipo === 'partida') {
            const ent2 = document.getElementById('ent2').value;
            const sal2 = document.getElementById('sal2').value;
            total += calcularHoras(ent2, sal2);
            t2 = `${ent2} - ${sal2}`;
        }

        registros.push({ fecha, tipo: tipo.toUpperCase(), t1: `${ent1} - ${sal1}`, t2, total: total.toFixed(2) });
        guardarYRefrescar();
    }

    function agregarDNT() {
        const fecha = document.getElementById('fecha').value;
        if (!fecha) return alert("Selecciona fecha");
        registros.push({ fecha, tipo: 'DNT', t1: '-', t2: '-', total: '0.00' });
        guardarYRefrescar();
    }

    function guardarYRefrescar() {
        localStorage.setItem('controlHorarioV3', JSON.stringify(registros));
        renderizarTabla();
    }

    function renderizarTabla() {
        const cuerpo = document.getElementById('cuerpoTabla');
        cuerpo.innerHTML = "";
        registros.sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
        registros.forEach((reg, index) => {
            const fila = cuerpo.insertRow();
            if(reg.tipo === 'DNT') fila.className = 'row-dnt';
            fila.innerHTML = `<td>${reg.fecha}</td><td>${reg.tipo}</td><td>${reg.t1}</td><td>${reg.t2}</td><td>${reg.total} h</td><td class="delete-btn"><button onclick="eliminar(${index})">❌</button></td>`;
        });
    }

    function eliminar(i) { if(confirm("¿Borrar?")) { registros.splice(i,1); guardarYRefrescar(); } }

    function exportarCSV() {
        let csv = "\ufeffFecha,Tipo,Turno1,Turno2,Total\n";
        registros.forEach(r => csv += `${r.fecha},${r.tipo},${r.t1},${r.t2},${r.total}\n`);
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        link.download = "control_horario.csv";
        link.click();
    }

    function importarCSV(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const lineas = e.target.result.split(/\r?\n/);
            const nuevos = [];
            const sep = lineas[0].includes(';') ? ';' : ',';

            for (let i = 1; i < lineas.length; i++) {
                const col = lineas[i].split(sep);
                if (col.length >= 5) {
                    nuevos.push({ fecha: col[0].trim(), tipo: col[1].trim(), t1: col[2].trim(), t2: col[3].trim(), total: col[4].trim() });
                }
            }
            if (nuevos.length > 0) {
                registros = [...registros, ...nuevos];
                guardarYRefrescar();
                alert("Importados " + nuevos.length + " registros.");
            } else {
                alert("No se reconoció el contenido del archivo.");
            }
            input.value = "";
        };
        reader.readAsText(file);
    }

    function limpiarTodo() { if(confirm("¿Borrar todo?")) { registros = []; guardarYRefrescar(); } }
</script>
</body>
</html>
